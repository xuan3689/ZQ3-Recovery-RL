[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zq3-recovery-rl"
version = "1.0.0"
description = "Predictive-perception + residual reinforcement learning guidance for reusable launch-vehicle vertical recovery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "裴志轩", email = "pzxwx3689@qq.com" }]
keywords = [
    "reinforcement-learning",
    "rocket-landing",
    "powered-descent",
    "guidance",
    "ppo",
    "state-estimation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26,<3.0",
    "torch>=2.1",
]

[project.optional-dependencies]
# plotting / CSV reporting used by scripts/make_figures.py
plot = ["matplotlib>=3.7", "pandas>=2.0"]
# everything needed to regenerate the full report (docx + pdf)
report = ["python-docx>=1.1", "PyMuPDF>=1.24", "matplotlib>=3.7", "pandas>=2.0"]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://github.com/example/zq3-recovery-rl"
Repository = "https://github.com/example/zq3-recovery-rl"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zq3rl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
