name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # install the CPU wheel explicitly so CI does not pull a multi-GB CUDA build
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # [report] brings python-docx / PyMuPDF so the report path is smoke-tested too
          pip install -e ".[dev,plot,report]"

      - name: Run test suite
        run: pytest -q

      - name: Smoke-test the CLI entry points
        run: |
          python scripts/train.py --help
          python scripts/evaluate.py --help
          python scripts/ablation.py --help
          python scripts/make_figures.py --help
          python scripts/make_report.py --help

      - name: Verify the environment contract holds
        run: |
          python - <<'PY'
          import numpy as np
          from zq3rl.config import Config
          from zq3rl.env import RecoveryEnv

          cfg = Config()
          env = RecoveryEnv(cfg, seed=0)
          obs, _ = env.reset(seed=0)
          assert obs.shape == (env.OBS_DIM,), obs.shape
          assert np.all(np.isfinite(obs))
          # a handful of steps must not raise or produce non-finite rewards
          for _ in range(20):
              obs, r, done, trunc, _ = env.step(np.zeros(3))
              assert np.isfinite(r)
              if done or trunc:
                  break
          print("env contract OK; OBS_DIM =", env.OBS_DIM)
          PY
